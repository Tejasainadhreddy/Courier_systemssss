{% extends "layout.html" %}
{% block content %}

<!-- Full Page Background -->
<div class="container-fluid py-5" 
     style="background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)), 
            url('https://images.unsplash.com/photo-1715635845783-a184542d95e5?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'); 
            background-size: cover; 
            background-position: center; 
            min-height: 100vh; 
            color: white; 
            display: flex; 
            align-items: center;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                
                <!-- Transparent Form Card -->
                <div class="card border-0 shadow-xl rounded-4 overflow-hidden" 
                     style="background: rgba(255,255,255,0.78); backdrop-filter: blur(8px);">
                    
                    <!-- Red Header -->
                    <div class="bg-danger p-4 text-center text-white">
                        <i class="bi bi-headset fs-1 mb-2"></i>
                        <h3 class="fw-bold mb-1">Customer Support</h3>
                        <p class="text-white-50 mb-0 small">Team_7 is here to help you</p>
                    </div>

                    <!-- Form Body - Smaller Fields -->
                    <div class="card-body p-4">
                        <form method="POST" action="/about">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">FULL NAME</label>
                                <input type="text" name="name" class="form-control bg-light border-0 py-2" placeholder="John Doe" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">EMAIL ADDRESS</label>
                                <input type="email" name="email" class="form-control bg-light border-0 py-2" placeholder="john@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">NATURE OF CONCERN</label>
                                <select name="subject" class="form-select bg-light border-0 py-2" required>
                                    <option value="" disabled selected>Select an option...</option>
                                    <option value="Late Delivery">Late Delivery</option>
                                    <option value="Tracking Issue">Tracking Issue</option>
                                    <option value="Damaged Parcel">Damaged Parcel</option>
                                    <option value="General Feedback">General Feedback</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small text-muted">YOUR MESSAGE</label>
                                <textarea name="message" class="form-control bg-light border-0 py-3" rows="4" placeholder="Describe your issue..." required></textarea>
                            </div>

                            <button type="submit" class="btn btn-danger w-100 fw-bold py-3 rounded-3 shadow-sm">
                                Submit Inquiry
                            </button>
                        </form>
                    </div>

                    <!-- Footer -->
                    <div class="card-footer bg-white text-center py-3">
                        <a href="/" class="text-muted small text-decoration-none">← Back to Home</a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}

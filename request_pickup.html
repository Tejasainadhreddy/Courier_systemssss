{% extends "layout.html" %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <!-- Header -->
                <div class="bg-danger text-white p-5 text-center">
                    <h2 class="fw-bold mb-1">Request Pickup</h2>
                    <p class="mb-0">Schedule a new shipment with Team_7 Logistics</p>
                </div>

                <div class="card-body p-5">
                    <form action="/request-pickup" method="POST">

                        <!-- Pickup Information Box -->
                        <div class="mb-5 p-4 border rounded-4" style="background: rgba(255,255,255,0.6);">
                            <label class="fw-bold small text-muted d-flex align-items-center gap-2 mb-3">
                                <i class="bi bi-geo-alt"></i> Pickup Information
                            </label>
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label class="small fw-bold text-muted">Contact Name</label>
                                    <input type="text" class="form-control bg-light border-0 py-3" value="{{ user.fullname }}" readonly>
                                </div>
                                <div class="col-md-12">
                                    <label class="small fw-bold text-muted">Street Address</label>
                                    <input type="text" class="form-control bg-light border-0 py-3" value="{{ user.address }}" readonly>
                                </div>
                            </div>
                        </div>

                        <!-- Delivery Information Box -->
                        <div class="mb-5 p-4 border rounded-4" style="background: rgba(255,255,255,0.6);">
                            <label class="fw-bold small text-muted d-flex align-items-center gap-2 mb-3">
                                <i class="bi bi-geo-alt"></i> Delivery Information
                            </label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">Contact Name</label>
                                    <input type="text" name="rev_name" class="form-control bg-light border-0 py-3" placeholder="Jane Smith" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="small fw-bold text-muted">Street Address</label>
                                    <input type="text" name="rev_full_address" class="form-control bg-light border-0 py-3" placeholder="456 Oak Avenue" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">City</label>
                                    <input type="text" name="city" class="form-control bg-light border-0 py-3" placeholder="Los Angeles" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">ZIP Code</label>
                                    <input type="text" name="zip" class="form-control bg-light border-0 py-3" placeholder="90001" required>
                                </div>
                            </div>
                        </div>

                        <!-- Package Details -->
                        <div class="mb-5 p-4 border rounded-4" style="background: rgba(255,255,255,0.6);">
                            <label class="fw-bold small text-muted d-flex align-items-center gap-2 mb-3">
                                <i class="bi bi-box-seam"></i> Package Details
                            </label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">Weight (kg)</label>
                                    <input type="number" step="0.1" name="weight" class="form-control bg-light border-0 py-3" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">Package Type</label>
                                    <select name="p_type" class="form-select bg-light border-0 py-3">
                                        <option>Box</option>
                                        <option>Pallet</option>
                                        <option>Envelope</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Special Instructions & Message -->
                        <div class="row g-4">
                            <div class="col-12">
                                <label class="small fw-bold text-muted">Special Instructions (for delivery team)</label>
                                <textarea name="special_instructions" class="form-control bg-light border-0 py-3" rows="3" placeholder="Handle with care, Fragile, Call before delivery..."></textarea>
                            </div>
                            <div class="col-12">
                                <label class="small fw-bold text-muted">Message on the Courier (for receiver)</label>
                                <textarea name="message_on_courier" class="form-control bg-light border-0 py-3" rows="2" placeholder="Happy Birthday Mom! / Please leave at front door"></textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 fw-bold py-4 mt-4 rounded-3">
                            Schedule Pickup
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

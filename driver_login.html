{% extends "layout.html" %}
{% block content %}
<div class="container-fluid" style="background: #212529; min-height: 100vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card bg-white shadow-2xl p-5 border-0">
                    <div class="text-center mb-4">
                        <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                            <i class="bi bi-truck fs-2"></i>
                        </div>
                        <h2 class="fw-bold text-dark">Driver Login</h2>
                        <p class="text-muted small">Access your assigned deliveries</p>
                    </div>
                    <form method="POST">
                        <div class="mb-3">
                            <input type="text" name="driver_name" class="form-control form-control-lg bg-light border-0 py-3" placeholder="Driver Name" required>
                        </div>
                        <div class="mb-4">
                            <input type="password" name="password" class="form-control form-control-lg bg-light border-0 py-3" placeholder="Password" required>
                        </div>
                        <button class="btn btn-primary w-100 btn-lg fw-bold rounded-pill py-3">LOGIN AS DRIVER</button>
                    </form>
                    <div class="text-center mt-4">
                        <a href="/login" class="text-muted small">← Back to Admin / Customer Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

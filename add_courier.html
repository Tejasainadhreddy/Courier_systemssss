{% extends "layout.html" %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <!-- Header -->
                <div class="bg-danger text-white p-5 text-center">
                    <h2 class="fw-bold mb-1">Register New Shipment</h2>
                    <p class="mb-0">Create a new parcel for delivery</p>
                </div>

                <div class="card-body p-5">
                    <form method="POST">
                        <!-- Sender Information Box -->
                        <div class="mb-5 p-4 border rounded-4" style="background: rgba(255,255,255,0.6);">
                            <label class="fw-bold small text-muted d-flex align-items-center gap-2 mb-3">
                                <i class="bi bi-person-fill"></i> Sender Information
                            </label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">Sender Name</label>
                                    <input type="text" name="ship_name" class="form-control bg-light border-0 py-3" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">Sender Email</label>
                                    <input type="email" name="ship_email" class="form-control bg-light border-0 py-3" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">Sender Phone</label>
                                    <input type="text" name="ship_phone" class="form-control bg-light border-0 py-3" 
                                           placeholder="510-987-6543" maxlength="12" oninput="formatPhone(this)" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="small fw-bold text-muted">Sender Full Address</label>
                                    <textarea name="ship_full_address" class="form-control bg-light border-0 py-3" rows="2" required></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Receiver Information Box -->
                        <div class="mb-5 p-4 border rounded-4" style="background: rgba(255,255,255,0.6);">
                            <label class="fw-bold small text-muted d-flex align-items-center gap-2 mb-3">
                                <i class="bi bi-person-fill"></i> Receiver Information
                            </label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">Receiver Name</label>
                                    <input type="text" name="rev_name" class="form-control bg-light border-0 py-3" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">Receiver Email</label>
                                    <input type="email" name="rev_email" class="form-control bg-light border-0 py-3" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="small fw-bold text-muted">Receiver Phone</label>
                                    <input type="text" name="rev_phone" class="form-control bg-light border-0 py-3" 
                                           placeholder="510-987-6543" maxlength="12" oninput="formatPhone(this)" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="small fw-bold text-muted">Receiver Full Address</label>
                                    <textarea name="rev_full_address" class="form-control bg-light border-0 py-3" rows="2" required></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Package Details Box -->
                        <div class="mb-5 p-4 border rounded-4" style="background: rgba(255,255,255,0.6);">
                            <label class="fw-bold small text-muted d-flex align-items-center gap-2 mb-3">
                                <i class="bi bi-box-seam"></i> Package Details
                            </label>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="small fw-bold text-muted">Weight (kg)</label>
                                    <input type="number" step="0.1" name="weight" class="form-control bg-light border-0 py-3" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="small fw-bold text-muted">Package Type</label>
                                    <select name="p_type" class="form-select bg-light border-0 py-3">
                                        <option>Box</option>
                                        <option>Pallet</option>
                                        <option>Envelope</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="small fw-bold text-muted">Priority</label>
                                    <select name="priority" class="form-select bg-light border-0 py-3">
                                        <option>Standard</option>
                                        <option>Express</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Special Instructions & Message -->
                        <div class="row g-4">
                            <div class="col-12">
                                <label class="small fw-bold text-muted">Special Instructions (for delivery team)</label>
                                <textarea name="special_instructions" class="form-control bg-light border-0 py-3" rows="3" placeholder="Handle with care, Fragile, Call before delivery..."></textarea>
                            </div>
                            <div class="col-12">
                                <label class="small fw-bold text-muted">Message on the Courier (for receiver)</label>
                                <textarea name="message_on_courier" class="form-control bg-light border-0 py-3" rows="2" placeholder="Happy Birthday! / Please leave at front door"></textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 fw-bold py-4 mt-4 rounded-3">
                            Save & Generate Tracking ID
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function formatPhone(input) {
    let value = input.value.replace(/\D/g, '');
    if (value.length > 3) value = value.slice(0,3) + '-' + value.slice(3);
    if (value.length > 7) value = value.slice(0,7) + '-' + value.slice(7);
    input.value = value.substring(0,12);
}
</script>
{% endblock %}
